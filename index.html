<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ApolloMusic - YouTube</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SPLASH SCREEN -->

    <div id="splash-screen">

        <div class="splash-content">

            <div class="splash-logo">
                <span class="apollo">APOLLO</span>
                <span class="music">MUSIC</span>
            </div>

            <div class="splash-version">
                YOUTUBE PLAYER
            </div>

            <div class="splash-loader">
                <div id="splash-progress"></div>
            </div>

            <p id="splash-status">
                Inicializando...
            </p>

            <div class="splash-author">
                <span>DESENVOLVIDO POR</span>
                <strong>@fofoxuto</strong>
            </div>

        </div>

    </div>


    <!-- APP -->

    <main class="app">

        <!-- STATUS -->

        <header class="header-centered">

            <span class="top-label">
                Reprodutor YouTube
            </span>

            <h1 id="status">
                Aguardando link.
            </h1>

        </header>


        <!-- PLAYER -->

        <section class="player">

            <!-- YOUTUBE CONTAINER -->

            <div
                id="youtubeContainer"
                class="youtube-container"
            ></div>

        </section>


        <!-- YOUTUBE INPUT -->

        <section class="library">

            <h2>
                YouTube
            </h2>


            <div class="youtube-input">

                <input
                    id="youtubeSearch"
                    type="url"
                    placeholder="Cole o link do YouTube (vídeo ou playlist)"
                    autocomplete="off"
                    spellcheck="false"
                >


                <button
                    id="searchYoutube"
                    type="button"
                >
                    Reproduzir
                </button>

            </div>


            <div
                id="youtubeResults"
                class="youtube-results"
            ></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
