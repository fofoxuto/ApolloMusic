<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#121212">

    <title>ApolloMusic - YouTube</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SPLASH -->

    <div id="splash-screen">

        <div class="splash-content">

            <div class="splash-logo">
                <span class="apollo">APOLLO</span>
                <span class="music">MUSIC</span>
            </div>

            <div class="splash-version">
                YOUTUBE PLAYER
            </div>

            <div class="splash-loader">
                <div id="splash-progress"></div>
            </div>

            <p id="splash-status">
                Inicializando...
            </p>

            <div class="splash-author">
                <span>DESENVOLVIDO POR</span>
                <strong>@fofoxuto</strong>
            </div>

        </div>

    </div>


    <!-- APP -->

    <main class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="brand">

                <div class="brand-mark">
                    A
                </div>

                <div class="brand-info">

                    <strong>ApolloMusic</strong>

                    <span>YouTube Player</span>

                </div>

            </div>


            <div class="status-area">

                <span class="status-dot"></span>

                <span id="status">
                    Aguardando link.
                </span>

            </div>

        </header>


        <!-- PLAYER -->

        <section class="player">

            <div class="player-header">

                <div>

                    <span class="eyebrow">
                        PLAYER
                    </span>

                    <h1>
                        Reproduzindo
                    </h1>

                </div>

                <div class="source-badge">

                    <span></span>

                    YouTube

                </div>

            </div>


            <div
                id="youtubeContainer"
                class="youtube-container"
            ></div>

        </section>


        <!-- INPUT -->

        <section class="library">

            <div class="library-header">

                <div>

                    <span class="eyebrow">
                        ADICIONAR MÚSICA
                    </span>

                    <h2>
                        YouTube
                    </h2>

                </div>

                <span class="section-number">
                    01
                </span>

            </div>


            <div class="youtube-input">

                <div class="input-wrap">

                    <span class="input-icon">
                        ▶
                    </span>

                    <input
                        id="youtubeSearch"
                        type="url"
                        placeholder="Cole o link do YouTube"
                        autocomplete="off"
                        spellcheck="false"
                    >

                </div>


                <button
                    id="searchYoutube"
                    type="button"
                >

                    <span>
                        Reproduzir
                    </span>

                    <strong>
                        →
                    </strong>

                </button>

            </div>


            <div
                id="youtubeResults"
                class="youtube-results"
            ></div>

        </section>


        <footer class="footer">

            <span>
                APOLLOMUSIC
            </span>

            <i>•</i>

            <span>
                YOUTUBE
            </span>

        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
